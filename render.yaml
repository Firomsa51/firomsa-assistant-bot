services:
  - type: web
    name: firomsa-assistant-bot
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false        # Set in Render dashboard — never commit this value
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_URL
        sync: false        # https://<your-render-service>.onrender.com
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: firomsa-bot-db
          property: connectionString
      - key: ADMIN_TELEGRAM_IDS
        sync: false
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: firomsa-bot-db
    databaseName: firomsa_bot
    user: botuser
    plan: free
